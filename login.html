<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS لوحة التحكم -->
    <link rel="stylesheet" href="admin-style.css">

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main class="admin-container">
        <header class="admin-header">
            <h2><i class="fa-solid fa-user-lock"></i> تسجيل الدخول</h2>
            <p>خاص بإدارة محل أبو عدنان</p>
        </header>

        <section class="admin-card">
            <form id="login-form">
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" id="email-input" placeholder="admin@example.com" required style="direction: ltr; text-align: left;">
                </div>

                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="password-input" placeholder="••••••••" required style="direction: ltr; text-align: left;">
                </div>

                <p id="error-msg" style="color: #e53e3e; font-size: 13px; margin-bottom: 15px; display: none;"></p>

                <button type="submit" class="save-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> دخول
                </button>
            </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
