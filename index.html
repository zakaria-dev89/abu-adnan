<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محل أبو عدنان للملابس النسائية</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS الرئيسي -->
    <link rel="stylesheet" href="style.css">

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- خلفية جمالية خفيفة -->
    <div class="bg-shape"></div>

    <main class="card-container">
        <!-- قسم الهوية والشعار -->
        <header class="profile-header">
            <div class="logo-wrapper">
                <div class="logo-icon">
                    <i class="fa-solid fa-shirt"></i>
                </div>
            </div>
            <h1>محل أبو عدنان</h1>
            <span class="tagline">أرقى أزياء وموضة الملبوسات النسائية</span>
            <p class="bio-text" id="bio-text">جاري تحميل البيانات...</p>
        </header>

        <!-- روابط التواصل الاجتماعي التفاعلية -->
        <section class="links-container">
            <a href="#" id="whatsapp-link" target="_blank" class="link-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>تواصل عبر الواتساب</span>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

            <a href="#" id="instagram-link" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>حسابنا على إنستغرام</span>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

            <a href="#" id="facebook-link" target="_blank" class="link-btn facebook">
                <i class="fa-brands fa-facebook-f"></i>
                <span>صفحتنا على فيسبوك</span>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

            <!-- زر مشاركة الموقع -->
            <button id="share-btn" class="link-btn share">
                <i class="fa-solid fa-share-nodes"></i>
                <span>مشاركة رابط المحل</span>
            </button>
        </section>

        <!-- قسم الفروع -->
        <section class="branches-section">
            <h3><i class="fa-solid fa-location-dot"></i> فروعنا:</h3>
            <ul id="branches-list">
                <li class="loading-skeleton">جاري تحميل الفروع...</li>
            </ul>
        </section>

        <!-- التذييل الحقوق -->
        <footer class="footer-text">
            <p>© محل أبو عدنان - جميع الحقوق محفوظة</p>
        </footer>
    </main>

    <!-- إشعار نسخ الرابط -->
    <div id="toast" class="toast">تم نسخ رابط المحل بنجاح! 📋</div>

    <script src="script.js"></script>
</body>
</html>
