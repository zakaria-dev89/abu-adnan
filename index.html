<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محل أبو عدنان للملابس النسائية</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS الرئيسي -->
    <link rel="stylesheet" href="style.css">

    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main class="card-container">
        <!-- قسم الهوية والترحيب -->
        <header class="profile-header">
            <div class="logo-icon">
                <i class="fa-solid fa-shirt"></i>
            </div>
            <h1>محل أبو عدنان</h1>
            <span class="tagline">أرقى أزياء وموضة الملبوسات النسائية</span>
            <p class="bio-text" id="bio-text">جاري تحميل البيانات...</p>
        </header>

        <!-- روابط التواصل الاجتماعي -->
        <section class="links-container">
            <a href="#" id="whatsapp-link" target="_blank" class="link-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>تواصل عبر الواتساب</span>
            </a>

            <a href="#" id="instagram-link" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>حسابنا على إنستغرام</span>
            </a>

            <a href="#" id="facebook-link" target="_blank" class="link-btn facebook">
                <i class="fa-brands fa-facebook-f"></i>
                <span>صفحتنا على فيسبوك</span>
            </a>
        </section>

        <!-- قسم الفروع -->
        <section class="branches-section">
            <h3><i class="fa-solid fa-location-dot"></i> فروعنا:</h3>
            <ul id="branches-list">
                <li>جاري تحميل الفروع...</li>
            </ul>
        </section>
    </main>

    <!-- ملف الاتصال وجلب البيانات -->
    <script src="script.js"></script>
</body>
</html>
