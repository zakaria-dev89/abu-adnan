<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>محل أبو عدنان للملابس النسائية</title>

    <!-- تحسينات محركات البحث ومظهر الهواتف -->
    <meta name="description" content="محل أبو عدنان للملابس النسائية - أرقى أزياء وموضة الملبوسات النسائية">
    <meta name="theme-color" content="#130f1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS الرئيسي المتناسق للجوال واللابتوب -->
    <link rel="stylesheet" href="style.css">

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- عناصر إضاءة خلفية جمالية للشاشات الكبيرة واللابتوب -->
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-3" aria-hidden="true"></div>

    <main class="card-container">
        <!-- قسم الهوية والشعار -->
        <header class="profile-header">
            <div class="logo-wrapper">
                <div class="logo-icon">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <div class="verified-badge" title="متجر موثوق">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
            <h1>محل أبو عدنان</h1>
            <span class="tagline">أرقى أزياء وموضة الملبوسات النسائية</span>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>متواجدون دائماً لخدمتكم</span>
            </div>
            <p class="bio-text" id="bio-text">جاري تحميل البيانات...</p>
        </header>

        <!-- روابط التواصل الاجتماعي التفاعلية -->
        <section class="links-container" aria-label="طرق التواصل">
            <a href="#" id="whatsapp-link" target="_blank" rel="noopener noreferrer" class="link-btn whatsapp">
                <span class="btn-icon"><i class="fa-brands fa-whatsapp"></i></span>
                <span class="btn-text">تواصل عبر الواتساب</span>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <a href="#" id="instagram-link" target="_blank" rel="noopener noreferrer" class="link-btn instagram">
                <span class="btn-icon"><i class="fa-brands fa-instagram"></i></span>
                <span class="btn-text">حسابنا على إنستغرام</span>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <a href="#" id="facebook-link" target="_blank" rel="noopener noreferrer" class="link-btn facebook">
                <span class="btn-icon"><i class="fa-brands fa-facebook-f"></i></span>
                <span class="btn-text">صفحتنا على فيسبوك</span>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- زر مشاركة الموقع -->
            <button id="share-btn" type="button" class="link-btn share">
                <span class="btn-icon"><i class="fa-solid fa-share-nodes"></i></span>
                <span class="btn-text">مشاركة رابط المحل</span>
                <i class="fa-solid fa-copy arrow-icon"></i>
            </button>
        </section>

        <!-- قسم الفروع -->
        <section class="branches-section" aria-label="فروع المحل">
            <div class="branches-header">
                <h3><i class="fa-solid fa-location-dot"></i> فروعنا</h3>
                <span class="branches-count" id="branches-count"></span>
            </div>
            <ul id="branches-list" class="branches-list">
                <li class="loading-skeleton">جاري تحميل الفروع...</li>
            </ul>
        </section>

        <!-- التذييل الحقوق -->
        <footer class="footer-text">
            <p>© محل أبو عدنان - جميع الحقوق محفوظة</p>
        </footer>
    </main>

    <!-- إشعار نسخ الرابط -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <i class="fa-solid fa-circle-check"></i>
        <span>تم نسخ رابط المحل بنجاح!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
